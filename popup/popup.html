<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearSky 双语翻译</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon48.png" alt="">
      <div><b>ClearSky 双语翻译</b><small id="engine">正在读取引擎…</small></div>
    </div>
    <a class="gear" id="openOptions" href="#" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>

  <main>
    <section class="card">
      <div class="langline">
        <span class="muted">翻译成</span>
        <select id="targetLang" aria-label="目标语言"></select>
      </div>
      <button id="toggle" class="btn primary block">翻译此页面</button>
      <p id="pageHint" class="hint muted" hidden></p>
      <div class="seg" id="mode" role="tablist" aria-label="显示方式">
        <button data-mode="bilingual" role="tab">双语对照</button>
        <button data-mode="replace" role="tab">仅显示译文</button>
      </div>
      <div class="row">
        <label class="label" for="always">总是翻译此网站<small id="host">—</small></label>
        <label class="switch"><input type="checkbox" id="always"><span></span></label>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="label">视频双语字幕<small>YouTube 打开字幕即可</small></div>
        <label class="switch"><input type="checkbox" id="ytEnabled"><span></span></label>
      </div>
      <div class="row">
        <div class="label">同时显示原文字幕</div>
        <label class="switch"><input type="checkbox" id="ytOrig"><span></span></label>
      </div>
    </section>
  </main>

  <footer>
    <span>快捷键 <span class="kbd">Alt</span> + <span class="kbd">A</span></span>
    <a href="#" id="openOptions2">更多设置</a>
  </footer>
  <script src="../lib/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
